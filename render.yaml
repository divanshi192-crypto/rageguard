# Render Blueprint — FastAPI backend (Docker build = reliable Python + deps).
#
# Public URL: https://reguguard-api.onrender.com (or https://<name>.onrender.com)
#
# After deploy, set in Vercel / frontend:
#   NEXT_PUBLIC_API_URL=https://reguguard-api.onrender.com
#
# In Render → Environment, set at least:
#   GROQ_API_KEY
#   FRONTEND_URL=https://your-frontend.vercel.app  (comma-separated for multiple)

services:
  - type: web
    name: reguguard-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: FRONTEND_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: ANTHROPIC_API_KEY
        sync: false
